[package]
name = "convertor"
version = "0.1.0"
description = "A fast, private desktop toolbox"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
dunce = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
